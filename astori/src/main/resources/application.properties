# 1. PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/asiakastiedot
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA and Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. JSP view prefix and suffix
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# 4. Google Calendar one-way sync configuration
# Set calendar-id to "primary" for your own main calendar, or a specific calendar id.
google.calendar.enabled=true
google.calendar.calendar-id=primary
google.calendar.api-key=
google.calendar.access-token=${GOOGLE_CALENDAR_ACCESS_TOKEN:}
google.calendar.default-tyyppi-nimi=Google
google.calendar.scope=https://www.googleapis.com/auth/calendar.readonly